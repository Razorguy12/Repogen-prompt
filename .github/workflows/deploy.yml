
name: Deploy Repogen to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /var/www/repogen/Repogen-prompt

            git fetch origin main
            git reset --hard origin/main

            cd web
            npm ci
            npm run build

            cd /var/www/repogen/Repogen-prompt
            # Python deps (alembic is new) and schema migrations before restart.
            if [ -x .venv/bin/python ]; then PY=.venv/bin/python
            elif [ -x venv/bin/python ]; then PY=venv/bin/python
            else echo "No .venv or venv found in $(pwd)" >&2; exit 1; fi
            $PY -m pip install -q -r requirements.txt
            $PY migrate.py
            sudo systemctl restart repogen
            sudo systemctl is-active --quiet repogen
            for attempt in $(seq 1 20); do
              if curl --fail --silent --show-error http://127.0.0.1:8000/api/health; then
                break
              fi
              if [ "$attempt" -eq 20 ]; then
                echo "Repogen health check failed after restart" >&2
                exit 1
              fi
              sleep 3
            done
            sudo nginx -t
            sudo systemctl reload nginx
